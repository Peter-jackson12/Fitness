[project]
name = "fitness-exercise-classification"
version = "0.1.0"
description = "피트니스 이미지 기반 운동 종류 분류 — ResNet18 Scratch / Feature Extraction / Fine-tuning 비교"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "openai>=3.60.0",
]

[tool.uv]
package = false

# Windows·Linux에서는 CUDA 13.0 빌드를 쓴다(RTX 50 시리즈 sm_120 지원).
# macOS 등 다른 환경은 PyPI 기본 빌드를 받는다.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
