<svg xmlns="http://www.w3.org/2000/svg" width="880" height="317" viewBox="0 0 880 317" role="img" aria-labelledby="title desc"><title id="title">평가 표본의 실제 구조</title><desc id="desc">이미지 수와 사람 단위 표본 수는 동일한 개념이 아닙니다.</desc><rect width="880" height="317" rx="18" fill="#f6f8fb"/><g font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif"><text x="30" y="42" font-size="26" font-weight="700" fill="#172b45" text-anchor="start" >평가 표본의 실제 구조</text><text x="30" y="67" font-size="14" font-weight="400" fill="#54677e" text-anchor="start" >이미지 수와 사람 단위 표본 수는 동일한 개념이 아닙니다.</text><rect x="30" y="95" width="246" height="96" rx="12" fill="#ffffff" stroke="#d8e2ec" /><text x="153" y="136" font-size="31" font-weight="700" fill="#2463a6" text-anchor="middle" >1,432장</text><text x="153" y="164" font-size="15" font-weight="400" fill="#54677e" text-anchor="middle" >Test 이미지</text><rect x="317" y="95" width="246" height="96" rx="12" fill="#ffffff" stroke="#d8e2ec" /><text x="440" y="136" font-size="31" font-weight="700" fill="#087e83" text-anchor="middle" >179개</text><text x="440" y="164" font-size="15" font-weight="400" fill="#54677e" text-anchor="middle" >클립 (8장씩)</text><rect x="604" y="95" width="246" height="96" rx="12" fill="#ffffff" stroke="#d8e2ec" /><text x="727" y="136" font-size="31" font-weight="700" fill="#bb592c" text-anchor="middle" >3명</text><text x="727" y="164" font-size="15" font-weight="400" fill="#54677e" text-anchor="middle" >독립된 사람 코드</text><line x1="282" y1="143" x2="311" y2="143" stroke="#91a3b8" stroke-width="2" /><path d="M305 137L311 143L305 149" fill="none" stroke="#91a3b8" stroke-width="2"/><line x1="569" y1="143" x2="598" y2="143" stroke="#91a3b8" stroke-width="2" /><path d="M592 137L598 143L592 149" fill="none" stroke="#91a3b8" stroke-width="2"/><rect x="30" y="210" width="820" height="70" rx="10" fill="#fff4e8" stroke="none" /><text x="48" y="237" font-size="15" font-weight="700" fill="#bb592c" text-anchor="start" >해석 주의</text><text x="48" y="261" font-size="16" font-weight="400" fill="#172b45" text-anchor="start" >이미지 1,432장을 평가했지만 새로운 사람에 대한 일반화 검증 대상은 3명입니다.</text><text x="30" y="300" font-size="12" font-weight="400" fill="#54677e" text-anchor="start" >출처: E08/pred_test.csv (고유 image_id·clip_id·person_id)</text></g></svg>
